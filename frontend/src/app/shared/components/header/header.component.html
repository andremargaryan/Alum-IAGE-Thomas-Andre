<header class="navbar">
  <div class="nav-brand">
    <a routerLink="/events">🎓 Alum-IAGE</a>
  </div>

  @if (authService.isLoggedIn()) {
    <nav class="nav-links">
      <a routerLink="/events" routerLinkActive="active">Événements</a>
      <a routerLink="/forum" routerLinkActive="active">Forum</a>
    </nav>

    <div class="nav-user">
      <span class="user-badge">
        {{ authService.currentUser()?.prenom }} {{ authService.currentUser()?.nom }}
        <small>({{ authService.userRole() }})</small>
      </span>
      <button type="button" class="btn-logout" (click)="authService.logout()">
        Déconnexion
      </button>
    </div>
  } @else {
    <nav class="nav-links">
      <a routerLink="/login" routerLinkActive="active">Connexion</a>
      <a routerLink="/register" routerLinkActive="active">Inscription</a>
    </nav>
  }
</header>
