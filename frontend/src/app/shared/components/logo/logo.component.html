<div class="brand-logo" [class]="size()">
  <div class="logo-mark">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="sorbonneBlueDark" x1="10" y1="40" x2="34" y2="8" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2563eb" />
          <stop offset="100%" stop-color="#93c5fd" />
        </linearGradient>
        <linearGradient id="sorbonneGoldDark" x1="15" y1="31" x2="34" y2="27" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#d4af37" />
          <stop offset="100%" stop-color="#fde68a" />
        </linearGradient>
      </defs>
      <!-- Jambe gauche du A -->
      <path d="M21.2 8H26.8L15.4 40H9.2L21.2 8Z" fill="url(#sorbonneBlueDark)" />
      <!-- Jambe droite du A -->
      <path d="M26.8 8H21.2L32.6 40H38.8L26.8 8Z" fill="#ffffff" />
      <!-- Barre centrale dorée du A -->
      <path d="M16.5 28.5H31.5L29.6 33.5H14.6L16.5 28.5Z" fill="url(#sorbonneGoldDark)" />
    </svg>
  </div>

  @if (showText()) {
    <span class="logo-text">
      ALUM<span class="logo-accent">-IAGE</span>
    </span>
  }
</div>
