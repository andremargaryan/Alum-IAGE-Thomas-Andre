<section class="centered-stage">
  <div class="eyebrow">
    <span class="gold-dot"></span>
    <span>Paris 1 Panthéon-Sorbonne · Master MIAGE</span>
  </div>

  <h1 class="stage-title">
    Votre réseau <span class="serif-italic text-sorbonne-accent">Alum-IAGE</span>
  </h1>

  <p class="stage-subtitle">
    Événements, entraide et opportunités entre étudiants et diplômés.
  </p>

  <form (ngSubmit)="onSubmit()" class="centered-form">
    <div class="field">
      <label for="email">Adresse email</label>
      <input
        id="email"
        name="email"
        type="email"
        class="input-sleek"
        placeholder="prenom.nom@etu.univ-paris1.fr"
        [(ngModel)]="email"
        required
      />
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        name="motDePasse"
        type="password"
        class="input-sleek"
        placeholder="••••••••"
        [(ngModel)]="motDePasse"
        required
      />
    </div>

    @if (errorMessage()) {
      <div class="alert-error">{{ errorMessage() }}</div>
    }

    <button type="submit" class="btn-sorbonne submit-cta" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner"></span> Connexion...
      } @else {
        Se connecter →
      }
    </button>
  </form>

  <div class="stage-divider"></div>

  <p class="switch-link">
    Pas encore de compte ?
    <a routerLink="/register">Créer un accès membre</a>
  </p>
</section>
